version: 1
environments:
  production:
    providers:
      - kind: s3
        name: prod-assets
        endpoint: https://<accountid>.r2.cloudflarestorage.com
        config:
          bucket: my-site-assets
          region: auto
          addressing_style: path
          cache_control: public, max-age=3600
          conditional_mode: etag
          workers: 10
        filter:
          include:
            types:
              - ^image/
              - ^video/
              - ^audio/
        secrets:
          - name: access_key_id
            key: R2_ACCESS_KEY_ID
          - name: secret_access_key
            key: R2_SECRET_ACCESS_KEY
      - kind: git
        name: prod-pages
        endpoint: git@github.com:acme/site.git
        config:
          branch: gh-pages
          author_name: hyperproviders bot
          author_email: bot@example.com
          tag_enabled: true
          tag_prefix: build-
          tag_retain_last: 50
        filter:
          exclude:
            types:
              - ^image/
              - ^video/
              - ^audio/
        secrets:
          - name: ssh_private_key
            key: DEPLOY_SSH_KEY
  staging:
    providers:
      - kind: s3
        name: staging-assets
        endpoint: https://<accountid>.r2.cloudflarestorage.com
        config:
          bucket: my-site-staging
          region: auto
          addressing_style: path
        secrets:
          - name: access_key_id
            key: R2_ACCESS_KEY_ID
          - name: secret_access_key
            key: R2_SECRET_ACCESS_KEY

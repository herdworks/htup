name: Auto-Add Issues & PRs to GitHub Project

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-project:
    name: Add to Project
    runs-on: ubuntu-latest
    steps:
      - name: Add to Project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/herdworks/projects/4
          github-token: ${{ secrets.PROJECTS_AUTOMATION_TOKEN }}
